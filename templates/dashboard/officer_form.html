{% extends 'base.html' %}

{% block title %}Add Officer — NCAA{% endblock %}
{% block page_heading %}Create Examination Officer{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg card">
  <form method="post" class="space-y-4" data-loading>
    {% csrf_token %}
    <div><label class="text-sm font-medium">Username *</label><input name="username" required class="form-input mt-1"></div>
    <div><label class="text-sm font-medium">Password *</label><input name="password" type="password" required class="form-input mt-1"></div>
    <div><label class="text-sm font-medium">Email</label><input name="email" type="email" class="form-input mt-1"></div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="text-sm font-medium">First name</label><input name="first_name" class="form-input mt-1"></div>
      <div><label class="text-sm font-medium">Last name</label><input name="last_name" class="form-input mt-1"></div>
    </div>
    <div><label class="text-sm font-medium">Employee ID</label><input name="employee_id" class="form-input mt-1"></div>
    <div><label class="text-sm font-medium">Phone</label><input name="phone" class="form-input mt-1"></div>
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="is_admin"> Assign System Admin role</label>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Create Officer</button>
      <a href="{% url 'system:officer_list' %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
