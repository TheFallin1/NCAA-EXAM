{% if messages %}
<div class="mb-4 space-y-2" x-data="{ show: true }">
  {% for message in messages %}
  <div
    class="rounded-lg border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'success' %}border-green-200 bg-green-50 text-green-800{% else %}border-sky-200 bg-sky-50 text-sky-900{% endif %}"
    role="alert"
  >
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
