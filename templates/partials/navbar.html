<header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white/90 px-4 backdrop-blur dark:border-slate-700 dark:bg-slate-900/90 md:px-6">
  <div class="flex items-center gap-3 min-w-0">
    <!-- Hamburger button for mobile -->
    <button @click="sidebarOpen = true" class="rounded-lg border border-slate-200 p-2 text-slate-600 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800 lg:hidden" title="Open sidebar">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
    <div class="min-w-0">
      <h1 class="truncate text-base font-semibold leading-tight text-[#1A1B5D] dark:text-sky-300 md:text-lg">{% block page_heading %}Dashboard{% endblock %}</h1>
      <p class="truncate text-[10px] text-slate-500 dark:text-slate-400 sm:text-xs">{% block page_subheading %}Nigeria Civil Aviation Authority{% endblock %}</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <button type="button" @click="toggle()" class="rounded-lg border border-slate-200 p-2 text-sm dark:border-slate-600" title="Toggle theme">
      <span x-show="!dark">🌙</span>
      <span x-show="dark">☀️</span>
    </button>
    <div class="hidden text-right sm:block">
      <p class="text-sm font-medium">{{ user.get_full_name|default:user.username }}</p>
      <p class="text-xs text-slate-500">Examination Officer</p>
    </div>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn-secondary text-xs">Logout</button>
    </form>
  </div>
</header>
