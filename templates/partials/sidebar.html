{% load static %}
<!-- Mobile backdrop overlay -->
<div 
  x-show="sidebarOpen" 
  @click="sidebarOpen = false" 
  x-transition:enter="transition-opacity ease-linear duration-300"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition-opacity ease-linear duration-300"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm lg:hidden"
  x-cloak>
</div>

<aside 
  class="fixed inset-y-0 left-0 z-50 w-64 border-r border-slate-200 bg-[#1A1B5D] text-white shadow-lg transition-transform duration-300 ease-in-out lg:translate-x-0"
  :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
  @keydown.escape.window="sidebarOpen = false"
  x-cloak>
  <div class="flex h-16 items-center justify-between gap-3 border-b border-white/10 px-4">
    <div class="flex items-center gap-3 min-w-0">
      <img src="{% static NCAA_LOGO_URL %}" alt="NCAA Logo" class="h-11 w-11 rounded-full object-contain bg-white p-0.5 shrink-0">
      <div class="min-w-0">
        <p class="truncate text-xs font-medium text-sky-200">NCAA</p>
        <p class="truncate text-sm font-bold leading-tight">Exam Scheduling</p>
      </div>
    </div>
    <!-- Close button for mobile -->
    <button @click="sidebarOpen = false" class="rounded-lg p-1 text-white/80 hover:bg-white/10 hover:text-white lg:hidden" title="Close sidebar">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  <nav class="space-y-1 p-4">
    <a href="{% url 'dashboard:home' %}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/10">Dashboard</a>
    <a href="{% url 'exams:schedule' %}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/10">Schedule Exam</a>
    <a href="{% url 'exams:list' %}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/10">Search Records</a>
    <a href="{% url 'slips:records' %}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/10">Slip Records</a>
    <a href="{% url 'dashboard:export_csv' %}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/10">Export CSV</a>
    {% if is_system_admin %}
    <div class="my-4 border-t border-white/10 pt-4">
      <p class="px-3 text-xs uppercase tracking-wider text-sky-200/80">Administration</p>
      <a href="{% url 'system:portal' %}" class="mt-2 flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/10">System Portal</a>
    </div>
    {% endif %}
  </nav>
</aside>
